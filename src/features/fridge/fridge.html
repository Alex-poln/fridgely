<div class="page-heading">
  <div>
    <h1>Mein Kühlschrank</h1>
    
  </div>
  <div class="actions">
  <button class="btn secondary" id="scan-receipt">
    <span class="material-symbols-rounded" aria-hidden="true">receipt_long</span>
    Kassenbon scannen
  </button>
  <button class="btn" id="add">
    <span class="material-symbols-rounded" aria-hidden="true">add</span>
    Lebensmittel hinzufügen
  </button>
  </div>
</div>
<div id="notice"></div>

<p class="stock-summary"><span id="total">0</span> Lebensmittel · <span id="soon">0</span> bald fällig<span id="recipes-count" hidden></span></p>

<div class="toolbar">
  <label class="search"
    ><span class="material-symbols-rounded" aria-hidden="true">search</span
    ><input
      id="search"
      aria-label="Vorrat durchsuchen"
      placeholder="Was suchst du?"
  /></label>
  <div class="filters" aria-label="Vorratsfilter">
    <button class="chip active" data-filter="all">Alle</button
    ><button class="chip" data-filter="soon">Bald fällig</button
    ><button class="chip" data-filter="expired">Abgelaufen</button>
  </div>
</div>
<div id="stock" class="grid"></div>
