<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Dein Vorrat. Deine Rezepte. Weniger verschwenden, bewusster kochen."
    />
    <title>Fridgely · Deine Küche, weitergedacht</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/brand/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block"
    />
  </head>
  <body data-auth="checking">
    <a class="skip" href="#main">Zum Inhalt</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#fridge" aria-label="Fridgely – Kühlschrank"><img class="brand-logo" src="./src/assets/brand/fridgely-logo.svg" alt="Fridgely" width="190" height="42"></a>
        <p class="nav-label">DEINE KÜCHE</p>
        <nav id="navigation" aria-label="Hauptnavigation"></nav>
        <div class="sidebar-bottom">
          <button id="nussi-guide" type="button" aria-label="Nussi erklärt dir die App"></button>
          <div class="small-kicker">WENIGER VERSCHWENDEN.</div>
          <p>Mehr aus deinem<br />Vorrat machen.</p>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span class="top-caption">Ein guter Tag beginnt in deiner Küche.</span
          ><a class="brand mobile-brand" href="#fridge"><img class="brand-logo" src="./src/assets/brand/fridgely-logo.svg" alt="Fridgely" width="150" height="33"></a
          ><a id="account-link" class="account-pill" href="#auth"
            ><span class="material-symbols-rounded" aria-hidden="true"
              >person</span
            ><span id="account-label">Anmelden</span></a
          >
        </header>
        <main id="main" tabindex="-1"></main>
        <footer>Mit Vorrat kochen. Mit gutem Gefühl genießen.</footer>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="modal"><div id="modal-body"></div></dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
